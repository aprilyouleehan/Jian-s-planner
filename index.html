<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="고양이 플래너">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<meta name="theme-color" content="#FAF9F5">
<title>지안이의 고양이 플래너</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Single+Day&family=Jua&family=Gowun+Dodum&family=Gaegu:wght@700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--bg:#FAF9F5;--card:#FFFFFF;--y:#FFE778;--yd:#F2D34E;--g:#A8D590;--gs:#E6F3DD;--gd:#4E8A3A;--ink:#303030;--mut:#6F6F6B;--line:#E8E8E5;--r:16px;--nav:64px;
  --hand:'Gaegu','Noto Sans KR',sans-serif;--sans:'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink)}
body{font-family:var(--sans);font-size:15px;line-height:1.4;overscroll-behavior:none;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.hidden{display:none!important}
#phone{position:relative;height:100%;overflow:hidden}
.view{position:absolute;left:0;right:0;top:0;bottom:calc(var(--nav) + env(safe-area-inset-bottom));overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.wrap{max-width:480px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px 28px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3,p{margin:0}
.hand{font-family:var(--hand);font-weight:700}
.title{font-family:var(--hand);font-weight:700;font-size:30px;line-height:1.1}
.sec{font-family:var(--hand);font-weight:700;font-size:22px;line-height:1.1}
.mut{color:var(--mut)}
.small{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1;min-width:0}
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn.y{background:var(--y);border-color:var(--yd)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn:disabled{background:#F3F2EE;border-color:var(--line);color:#9A9994;cursor:default}
.pill{display:inline-flex;align-items:center;gap:5px;height:34px;padding:0 12px;border-radius:99px;background:#fff;border:1px solid var(--line);font-weight:700;font-size:15px}
.bar{height:8px;border-radius:99px;background:#F0EFEA;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--g);transition:width .4s}
.bar.y i{background:var(--y)}
.count{font-size:13px;font-weight:700;color:var(--mut)}
/* 정원 */
#garden{position:relative;height:184px;border-radius:20px;overflow:hidden;border:1px solid var(--line);background:#8CC75C none center 35%/cover no-repeat}
#stage{position:absolute;inset:0;overflow:hidden}
.actor{position:absolute;bottom:14px;width:104px;margin-left:-52px;transform-origin:50% 100%;transition:left 1.6s ease-in-out,bottom 1.6s ease-in-out,transform 1.6s ease-in-out;cursor:pointer}
.actor .bob,.actor .breathe{display:block;transform-origin:50% 100%}
.actor .breathe{animation:breathe 2.8s ease-in-out infinite}
.actor img{display:block;width:104px;height:98px;object-fit:contain;object-position:50% 100%;transition:transform .25s;filter:drop-shadow(0 2px 2px rgba(20,50,10,.22))}
.actor .shadow{position:absolute;left:22px;right:22px;bottom:-4px;height:12px;border-radius:50%;background:radial-gradient(ellipse at center,rgba(20,55,12,.5),rgba(20,55,12,0) 70%)}
@keyframes breathe{50%{transform:scale(1.015,1.03)}}
.actor.walking .bob{animation:walkbob .38s ease-in-out infinite}
@keyframes walkbob{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-4px) rotate(-3deg)}75%{transform:translateY(-4px) rotate(3deg)}}
.actor.hopping .bob{animation:hop .8s cubic-bezier(.3,.7,.4,1)}
@keyframes hop{0%{transform:scale(1,1)}12%{transform:scale(1.14,.82)}38%,60%{transform:translateY(-30px) scale(.94,1.08)}82%{transform:translateY(0) scale(1.16,.8)}100%{transform:scale(1,1)}}
#pair{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:210px;text-align:center}
#pair img{width:200px;height:118px;object-fit:contain;object-position:50% 100%}
#bub{position:absolute;left:50%;top:12px;transform:translateX(-50%);max-width:calc(100% - 24px);padding:5px 14px;border-radius:16px;background:#fff;border:1px solid var(--line);font-family:var(--hand);font-weight:700;font-size:17px;line-height:1.2;text-align:center;z-index:5;transition:left .5s}
#bub::after{content:"";position:absolute;left:50%;bottom:-6px;width:10px;height:10px;margin-left:-5px;background:#fff;border-right:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg)}
#bub:empty{display:none}
#c3d{position:absolute;inset:0;width:100%;height:100%;touch-action:manipulation;cursor:pointer}
#stage.mode3d .actor,#stage.mode3d #pair{display:none!important}
.lab3d,.tag3d{display:none}
@media (prefers-reduced-motion:reduce){.actor{transition:none}.actor .bob,.actor .breathe{animation:none!important}}
/* 현재 일정 */
.now{background:#FFFBE6;border-color:#F3E3A0}
.now .lbl{font-size:13px;font-weight:700;color:#8A6D00}
.now .nm{font-family:var(--hand);font-weight:700;font-size:26px;line-height:1.15;word-break:keep-all}
/* 목록 */
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;min-height:52px;padding:6px 0;border-top:1px solid var(--line);text-align:left;width:100%}
.item:first-child{border-top:0}
.chk{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid #CFCFC9;background:#fff;display:flex;align-items:center;justify-content:center;color:#fff}
.item.done .chk{background:var(--g);border-color:var(--g)}
.item.done .nm{color:var(--mut);text-decoration:line-through;text-decoration-color:#BDBDB7}
.item.wait .chk{border-style:dashed}
.item .nm{font-weight:500;font-size:15px;word-break:keep-all}
.item .tm{font-size:13px;color:var(--mut)}
.item.cur .nm{font-weight:700}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:700;background:var(--y)}
.tag.g{background:var(--gs);color:var(--gd)}
.more{align-self:center;min-height:40px;padding:0 14px;font-size:14px;font-weight:700;color:var(--mut)}
.playrow{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--gs);display:flex;align-items:center;gap:10px}
.hint{margin-top:10px;font-size:13px;color:var(--mut)}
/* 시간표 */
.seg{display:flex;padding:3px;border-radius:12px;background:#F0EFEA;gap:3px}
.seg button{flex:1;min-height:38px;border-radius:10px;font-weight:700;font-size:14px;color:var(--mut);display:flex;align-items:center;justify-content:center;gap:6px}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{min-height:48px;border-radius:12px;background:#fff;border:1px solid var(--line);font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:15px}
.day small{font-size:10px;font-weight:500;color:var(--mut)}
.day.on{background:var(--y);border-color:var(--yd)}
.day.on small{color:var(--ink)}
.ev{display:flex;gap:12px;align-items:stretch;width:100%;text-align:left;padding:12px;border-radius:14px;background:#fff;border:1px solid var(--line)}
.ev .bar2{flex:none;width:6px;border-radius:6px}
.ev .nm{font-weight:700;font-size:16px;word-break:keep-all}
.ev .tm{font-size:13px;color:var(--mut)}
.ev .detail{margin-top:6px;font-size:13px;color:var(--mut)}
.t-school{background:#D9D9D4}.t-study{background:#BBD7F2}.t-music{background:#FFE778}.t-sport{background:#A8D590}.t-play{background:#F7C6B4}
.nowline{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:#C2410C}
.nowline::after{content:"";flex:1;border-top:2px solid #F0A27C}
.wk{display:grid;grid-template-columns:22px repeat(7,minmax(0,1fr));gap:0}
.wk .col{position:relative;border-left:1px solid var(--line)}
.wk .col.today{background:#FFFBE6}
.blk{position:absolute;left:2px;right:2px;border-radius:5px;overflow:hidden;font-size:10px;font-weight:700;line-height:1.1;padding:2px 1px;text-align:center;display:flex;align-items:flex-start;justify-content:center;word-break:break-all}
.blk.sel{outline:2px solid var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--mut)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:4px;vertical-align:-1px}
/* 고양이방 */
.room{position:relative;height:210px;border-radius:20px;overflow:hidden;border:1px solid var(--line);background:#8CC75C none center 60%/cover no-repeat;display:flex;align-items:flex-end;justify-content:center}
.room img{height:150px;width:auto;margin-bottom:14px;filter:drop-shadow(0 3px 3px rgba(20,50,10,.25));transform-origin:50% 100%}
.room_old .say{position:absolute;left:50%;top:12px;transform:translateX(-50%);max-width:calc(100% - 24px);padding:5px 14px;border-radius:16px;background:#fff;border:1px solid var(--line);font-family:var(--hand);font-weight:700;font-size:17px;text-align:center}
.room_old .say:empty{display:none}
.joy{animation:joy .7s cubic-bezier(.3,.7,.4,1)}
@keyframes joy{0%{transform:scale(1,1)}15%{transform:scale(1.12,.86)}45%{transform:translateY(-26px) scale(.95,1.07)}80%{transform:scale(1.1,.9)}100%{transform:scale(1,1)}}
.heartfx{position:absolute;left:50%;bottom:120px;font-size:22px;color:#F27B8B;animation:rise 1s ease-out forwards;pointer-events:none}
@keyframes rise{to{transform:translate(var(--dx,0),-60px);opacity:0}}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.snack{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 8px;border-radius:14px;border:1px solid var(--line);background:#fff}
.snack b{font-size:14px}
.inv{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.inv .chip{flex:none;display:flex;align-items:center;gap:8px;padding:6px 6px 6px 10px;border-radius:12px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:14px}
.log{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.log:first-child{border-top:0}
.link{align-self:center;min-height:44px;padding:0 12px;font-size:13px;color:var(--mut);text-decoration:underline}
/* 하단 메뉴 */
nav{position:absolute;left:0;right:0;bottom:0;height:calc(var(--nav) + env(safe-area-inset-bottom));padding:0 8px env(safe-area-inset-bottom);display:flex;background:#fff;border-top:1px solid var(--line);z-index:10}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:700;color:#9A9994}
nav button .ic{width:48px;height:28px;border-radius:99px;display:flex;align-items:center;justify-content:center}
nav button.on{color:var(--ink)}
nav button.on .ic{background:var(--y)}
/* 겹침 화면 */
.modal-bg{position:absolute;inset:0;background:rgba(48,48,48,.4);z-index:40;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{width:100%;max-width:360px;max-height:90%;overflow-y:auto;border-radius:20px;background:#fff;padding:20px;display:flex;flex-direction:column;gap:12px;text-align:center;align-items:center}
.sheet{position:absolute;inset:0;z-index:45;background:var(--bg);overflow-y:auto}
.field{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;font-size:15px}
.ed{border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ed .full{grid-column:1/-1}
.ed label{font-size:12px;color:var(--mut);display:flex;flex-direction:column;gap:4px}
.step{display:flex;align-items:center;gap:8px}
.step button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:20px;font-weight:700}
.toast{position:absolute;left:50%;bottom:calc(var(--nav) + 14px + env(safe-area-inset-bottom));transform:translateX(-50%);padding:8px 16px;border-radius:99px;background:var(--ink);color:#fff;font-size:14px;font-weight:700;z-index:60;white-space:nowrap;display:flex;align-items:center;gap:6px;animation:tin .25s ease-out}
@keyframes tin{from{opacity:0;transform:translate(-50%,8px)}}
/* 놀이 */
.game{position:absolute;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column;user-select:none;-webkit-user-select:none}
.game .top{display:flex;align-items:center;gap:8px;padding:calc(12px + env(safe-area-inset-top)) 14px 10px;background:#fff;border-bottom:1px solid var(--line)}
.game .area{position:relative;flex:1;overflow:hidden;touch-action:none;background:#8CC75C none center/cover}
.game .ctl{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px 16px calc(16px + env(safe-area-inset-bottom));background:#fff}
.game .ctl button{min-height:72px;border-radius:16px;border:1px solid var(--line);background:#fff;font-size:28px;font-weight:700}
.fall{position:absolute;width:46px;margin-left:-23px;pointer-events:none}
.holes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:20px 18px 0}
.hole{position:relative;height:112px}
.hole .pit{position:absolute;left:6%;right:6%;bottom:6px;height:26px;border-radius:50%;background:#3E5F2A}
.hole .m{position:absolute;left:50%;bottom:16px;margin-left:-32px}
.hole .got{position:absolute;left:0;right:0;bottom:50px;text-align:center}

/* ── 시안 반영 ── */
.pill.y{background:var(--y);border-color:var(--yd)}
.hd{display:flex;align-items:center;gap:8px;font-family:var(--hand);font-weight:700;font-size:27px;line-height:1.1}
.hd svg{flex:none}
#h-hello{font-family:var(--hand);font-weight:700;font-size:21px;color:var(--mut);margin-top:4px;display:flex;align-items:center;gap:6px}
#garden{height:226px;margin:-4px -16px 0;border:0;border-radius:0;background:none;overflow:visible}
#garden::before{content:"";position:absolute;inset:0;background:#8CC75C none center 35%/cover no-repeat;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 26px);mask-image:linear-gradient(to bottom,transparent 0,#000 26px)}
#pair{bottom:36px}
#bub{top:30px}
.now{position:relative;z-index:6;margin-top:-46px;background:#fff;border-color:var(--line)}
.now .nm{font-size:22px}
.item.done .nm{text-decoration:none;color:#9A9994}
.item.done .t,.item.done svg.ti{opacity:.5}
.tico{flex:none;width:60px;height:60px;border-radius:16px;display:flex;align-items:center;justify-content:center}
.ch{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.ch svg{flex:none}
.ch .count{font-size:14px;font-weight:500}
.chev{width:40px;height:40px;margin:-8px -10px -8px 0;display:flex;align-items:center;justify-content:center;border-radius:50%;color:var(--mut)}
.chev.open svg{transform:rotate(90deg)}
.item{min-height:50px}
.item .t{flex:none;width:44px;font-size:14px;color:var(--ink);font-variant-numeric:tabular-nums}
.item .nm{font-family:var(--hand);font-weight:700;font-size:21px;line-height:1.15}
.item svg.ti{flex:none}
.chk.sq{border-radius:8px;width:26px;height:26px}
.rw{flex:none;font-size:13px;color:var(--mut);display:inline-flex;align-items:center;gap:3px}
nav{padding:6px 10px calc(6px + env(safe-area-inset-bottom));gap:6px}
nav button{border-radius:16px}
nav button .ic{height:26px}
nav button.on{background:var(--y)}
nav button.on .ic{background:none}
.seg{background:#fff;border:1px solid var(--line);border-radius:99px}
.seg button{border-radius:99px;font-family:var(--hand);font-size:18px;white-space:nowrap}
.seg button.on{background:var(--y);box-shadow:inset 0 0 0 1px var(--yd)}
.seg.sq{border-radius:16px}.seg.sq button{border-radius:13px;min-height:44px}
.days{margin-bottom:6px}
.day{min-height:0;width:42px;height:42px;border-radius:50%;justify-self:center;position:relative;font-family:var(--hand);font-size:20px}
.day.today::after{content:"";position:absolute;left:50%;bottom:-10px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--ink)}
.t-school{background:#E6E6E3}.t-study{background:#D6E7F8}.t-music{background:#FBF0B8}.t-sport{background:#E7DDF4}.t-play{background:#FAD9CC}
.tl{display:flex;flex-direction:column;gap:10px}
.tr{position:relative;display:grid;grid-template-columns:48px minmax(0,1fr);gap:10px}
.tr .tt{font-size:14px;line-height:1.55;padding-top:9px;text-align:center;font-variant-numeric:tabular-nums}
.tb{border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%}
.tb .nm{font-family:var(--hand);font-weight:700;font-size:22px;line-height:1.15;word-break:keep-all}
.tb .detail{display:block;margin-top:4px;font-size:13px;color:#55554F}
.nowmark{position:absolute;left:-4px;right:-4px;display:flex;align-items:center;transform:translateY(-50%);pointer-events:none;z-index:2}
.nowmark.free{position:static;transform:none;margin:0 -4px}
.nowmark b{flex:none;padding:2px 9px;border-radius:99px;background:var(--y);border:1px solid var(--yd);font-size:13px}
.nowmark i{flex:1;height:2px;background:#F2C94C;border-radius:2px}
.scene{position:relative;display:block;height:214px;width:calc(100% + 32px);margin:-2px -16px 0;overflow:hidden;background:linear-gradient(#FBEFD6 0 60%,#F1DAB3 60%)}
.scene .win{position:absolute;left:24px;top:16px;width:98px;height:82px;border:5px solid #fff;border-radius:8px;background:linear-gradient(#CFE9F7 0 55%,#CDE7B4 55%);box-shadow:0 0 0 1px #EAD9BD}
.scene .win::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:4px;margin-left:-2px;background:#fff}
.scene .win::after{content:"";position:absolute;top:50%;left:0;right:0;height:4px;margin-top:-2px;background:#fff}
.scene .plant{position:absolute;right:18px;bottom:66px}
.scene .cush{position:absolute;left:50%;bottom:44px;width:270px;height:66px;margin-left:-135px;border-radius:50%;background:#FFF8EA;border:1px solid #EAD9BD}
.scene .cw{position:absolute;left:0;right:0;bottom:62px;display:flex;justify-content:center}
.scene .cw img{height:108px;width:auto;transform-origin:50% 100%;filter:drop-shadow(0 2px 2px rgba(120,90,40,.2))}
.scene .say{position:absolute;left:50%;top:10px;transform:translateX(-50%);max-width:calc(100% - 24px);padding:5px 14px;border-radius:16px;background:#fff;border:1px solid var(--line);font-family:var(--hand);font-weight:700;font-size:17px;text-align:center;z-index:2}
.scene .say:empty{display:none}
.cats2{position:relative;z-index:2;margin-top:-40px}
.cc{padding:12px;text-align:left;display:block;width:100%}
.cc.on{border-color:var(--yd);box-shadow:0 0 0 2px var(--y)}
.nmh{font-family:var(--hand);font-weight:700;font-size:22px;line-height:1.1}
.snack{flex-direction:row;gap:10px;padding:12px;text-align:left;width:100%}
.snack svg{flex:none}

/* ── 시안 2차: 입체감·글꼴 위계·그림 레이어 ── */
:root{--mut:#77736F;--line:#E8E5DF;--yl:#FFF2B5;--ivory:#FFF8EB;--sh:0 1px 2px rgba(96,72,30,.06),0 6px 16px rgba(96,72,30,.08)}
.card{background:#FFFDF9;border-radius:20px;box-shadow:var(--sh)}
.pill,.btn,.back,.tabb,.snack,.day{box-shadow:0 1px 2px rgba(96,72,30,.06),0 3px 8px rgba(96,72,30,.06)}
.btn:disabled{box-shadow:none}
.pill.y{box-shadow:0 1px 2px rgba(150,110,0,.12),0 3px 8px rgba(150,110,0,.12)}
.item .nm{font-family:var(--sans);font-weight:500;font-size:16px;line-height:1.3}
.item.cur .nm{font-weight:700}
.tb .nm{font-family:var(--sans);font-weight:700;font-size:17px;line-height:1.3}
.seg button{font-family:var(--sans);font-size:14px}

/* 맞춤법 퀴즈: 카드를 든 고양이 그림이 곧 선택 버튼 */
.sq-opts{gap:8px;align-items:flex-end}
.sq-opt.sq-pick,.sq-opt.sq-pick.o0,.sq-opt.sq-pick.o1{position:relative;flex:1;min-width:0;min-height:0;padding:0;border:0;border-radius:0;background:none;box-shadow:none;transform-origin:50% 100%;filter:drop-shadow(0 6px 6px rgba(110,80,30,.18));transition:transform .12s,filter .25s,opacity .25s}
.sq-pick img{display:block;width:100%;height:auto}
.sq-pick:active{transform:scale(.97)}
.sq-word{position:absolute;top:62%;bottom:4%;display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(22px,7vw,30px);line-height:1.1;word-break:keep-all;color:#5A3A1C}
.sq-tint{position:absolute;top:56%;bottom:2.400%;border-radius:20% / 34%;opacity:0;transition:opacity .25s;pointer-events:none}
.sq-pick.p0 .sq-word,.sq-pick.p0 .sq-tint{left:12%;right:3%}
.sq-pick.p1 .sq-word,.sq-pick.p1 .sq-tint{left:3%;right:13%}
.sq-pick.good,.sq-pick.bad{background:none;border:0;box-shadow:none}
.sq-pick.good .sq-tint{opacity:1;background:#BDEB9E;mix-blend-mode:multiply}
.sq-pick.good .sq-word{color:#2F7A22}
.sq-pick.good::after{right:6%;top:50%}
.sq-pick.p1.good::after{right:15%}
.sq-pick.bad{filter:grayscale(.85) opacity(.55)}
.sq-pick.bad .sq-word{color:#8E857B}
.sq-pick.bad.picked{filter:grayscale(.5) opacity(.8)}
.sq-gap{flex:1;min-height:0}

/* 안내 문구: 낱말 중간에서 끊기지 않게, 또렷하게 */
.modal p,.modal h3,.toast,.gsay,.cz-card p{word-break:keep-all;overflow-wrap:break-word}
.g-how{margin:0;font-size:20px;line-height:1.5;color:var(--ink)}
.g-note{margin:0;width:100%;padding:9px 12px;border-radius:14px;background:#FFF4D2;font-size:16px;line-height:1.4;color:#7A5A12}
#g-intro .modal{gap:14px;padding:24px 20px 20px}
/* MEOW 위쪽 그림을 오늘 화면의 정원과 같은 크기로 */
#room .scene{aspect-ratio:1856/820}
#room .scene .rbg{object-fit:cover;object-position:50% 60%}

/* MEOW 말풍선: 말하는 고양이 쪽에 뜬다 */
#room .scene .say{max-width:54%;white-space:normal;word-break:keep-all;border:1.5px solid #3A372E;z-index:3;animation:tin2 .2s ease-out}
#room .scene .say.naong{left:6%;transform:none}
#room .scene .say.aeong{left:auto;right:6%;transform:none}
#room .scene .say::after{content:"";position:absolute;left:50%;bottom:-7px;width:10px;height:10px;margin-left:-5px;background:#fff;border-right:1.5px solid #3A372E;border-bottom:1.5px solid #3A372E;transform:rotate(45deg)}
#room .scene .say.naong::after{left:70%}
#room .scene .say.aeong::after{left:30%}
#room .scene .say:empty{display:none}
@keyframes tin2{from{opacity:0;translate:0 6px}}
@media (min-width:600px){
  html,body{background:#ECECEC}
  body{display:flex;align-items:center;justify-content:center}
  #phone{width:390px;height:min(844px,calc(100vh - 32px));border:10px solid #2B2B2B;border-radius:46px;background:var(--bg);box-shadow:0 12px 40px rgba(0,0,0,.18);flex:none;transform:translateZ(0)}
}

// 아래 비밀 열쇠는 Code.gs 맨 위의 SECRET과 똑같아야 해요. (이미 맞춰져 있으니 그대로 두세요)

// ───── 아래는 건드리지 않아도 돼요 ─────
(function(){
  const API = (window.JIAN_API || "").trim(), SECRET = window.JIAN_SECRET || "";
  const MOCK = "jian-preview-store";
  function load(){ try{ return JSON.parse(localStorage.getItem(MOCK)) || {}; }catch(e){ return {}; } }
  function keep(m){ try{ localStorage.setItem(MOCK, JSON.stringify(m)); }catch(e){} }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  function all(m){ return { ok: true, state: m.state || null, schedule: m.schedule || null, gifts: m.gifts || [], note: m.note || null }; }
  window.JIAN_PREVIEW = !API;
  window.JIAN_BACKEND = API ? {
    get: () => fetch(API + "?k=" + encodeURIComponent(SECRET)).then(r => r.json()),
    post: (b) => { b.secret = SECRET; return fetch(API, { method: "POST", body: JSON.stringify(b) }).then(r => r.json()); }
  } : {
    get: () => Promise.resolve(all(load())),
    post: (b) => {
      const m = load();
      if (b.action === "saveState") m.state = b.state;
      if (b.action === "gift") { m.gifts = (m.gifts || []).concat([{ id: uid(), n: Number(b.n) || 1, msg: b.msg || "", at: Date.now() }]).slice(-50); }
      if (b.action === "note") m.note = { text: b.text || "", at: Date.now() };
      if (b.action === "schedule") m.schedule = b.schedule;
      keep(m);
      return Promise.resolve(all(m));
    }
  };
})();

function shortName(n){ const b = n.replace(/ ?정규수업| ?[0-9]부|학원$/g, "").trim(); return (SHORT[b] || SHORT[n] || b).slice(0, 3); }

// ───────── 저장 (기존 기록을 그대로 이어 쓴다) ─────────
const BE = window.JIAN_BACKEND, PREVIEW = !!window.JIAN_PREVIEW;
let FIXED = DEFAULT_FIXED;
function norm(x){ const o = {}; for(let i=0;i<7;i++) o[i] = (x && Array.isArray(x[i])) ? x[i] : []; return o; }
try{ const sc = localStorage.getItem(KEY+"-schedule"); if(sc) FIXED = norm(JSON.parse(sc)); }catch(e){}
function fresh(){ return {v:2, fish:0, cats:{}, inv:{}, rewards:{cls:1, task:1, timed:2}, days:{}, running:null, log:[], updatedAt:0, sel:"naong"}; }
function upgrade(s){
  s = Object.assign(fresh(), s);
  ["naong","aeong"].forEach(k => {       // 예전 '몸무게' 기록은 '기분·친밀도'로 바꾼다
    const c = s.cats[k] || {};
    s.cats[k] = {mood: typeof c.mood === "number" ? c.mood : 60, aff: typeof c.aff === "number" ? c.aff : 0, day: c.day || keyOf(now()), pets: c.pets || {d:"", n:0}};
  });
  s.rewards = {cls:0, task:1, timed:3};
  s.inv = s.inv || {};
  s.profile = s.profile || {}; ["naong","aeong"].forEach(k => { s.profile[k] = Object.assign({}, PROFILE0[k], s.profile[k] || {}); });
  s.custom = Array.isArray(s.custom) ? s.custom : [];
  s.deco = s.deco || {}; s.deco.own = s.deco.own || {}; s.deco.on = s.deco.on || {};
  return s;
}
let S = upgrade({});
try{ const raw = localStorage.getItem(KEY); if(raw) S = upgrade(JSON.parse(raw)); }catch(e){}
function saveLocal(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
let pushT = null;
function save(){
  S.updatedAt = Date.now(); saveLocal();
  if(!BE) return;
  clearTimeout(pushT);
  pushT = setTimeout(() => { try{ BE.post({action:"saveState", state:S}).catch(()=>{}); }catch(e){} }, 700);
}
function logAdd(text, n){ S.log.unshift({t:Date.now(), text:text, n:n}); if(S.log.length > 40) S.log.length = 40; }
let syncing = false;
function sync(){
  if(!BE || syncing) return; syncing = true;
  BE.get().then(d => {
    syncing = false;
    if(!d || !d.ok) return;
    if(d.schedule){ FIXED = norm(d.schedule); try{ localStorage.setItem(KEY+"-schedule", JSON.stringify(FIXED)); }catch(e){} }
    if(d.state && d.state.v === 2 && (d.state.updatedAt||0) > (S.updatedAt||0)){ S = upgrade(d.state); saveLocal(); }
    else if(!d.state || d.state.v !== 2) save();
    render();
  }).catch(() => { syncing = false; });
}

// ───────── 하루 상태 ─────────
const TK = () => keyOf(now());
function day(k){ k = k || TK(); const d = S.days[k] || (S.days[k] = {cls:{}, tasks:{}, played:{}}); d.paid = d.paid || {}; d.played = d.played || {}; return d; }
const todayEvents = () => FIXED[now().getDay()] || [];
const taskDone = (d, id) => !!(d.tasks[id] && d.tasks[id].end);
function prog(){ const ev = todayEvents(), d = day(); return {n:{done: d.forceN ? ev.length : ev.filter(e => toMin(e[1]) <= nowMin()).length, total: ev.length}, a:{done: allTasks().filter(t => taskDone(d, t.id)).length, total: allTasks().length}}; }
function unlocked(cat){ const p = prog()[cat === "naong" ? "n" : "a"]; return cat === "naong" ? p.done >= p.total : p.total > 0 && p.done >= p.total; }
// 생선은 항목마다 하루에 한 번만 준다 (체크를 풀었다 다시 해도 또 주지 않는다)
function pay(key, amount, label){
  const d = day(); if(d.paid[key] || !amount) return 0;
  d.paid[key] = amount; S.fish += amount; logAdd(label, "+"+amount); return amount;
}
function cheer(k, mood, aff){ const c = S.cats[k]; c.mood = clamp(c.mood + mood, 0, 100); c.aff += aff; }
function settle(){               // 하루가 지나면 기분이 조금 차분해질 뿐, 벌점은 없다
  const t = TK();
  ["naong","aeong"].forEach(k => { const c = S.cats[k]; if(c.day === t) return;
    const diff = Math.max(1, Math.round((new Date(t) - new Date(c.day)) / 86400000)); c.mood = Math.max(50, c.mood - 8*diff); c.day = t; });
}
const moodTxt = m => m >= 80 ? "신나요" : m >= 60 ? "기분 좋아요" : "느긋해요";
const affLv = a => Math.floor(a / 20) + 1;

  const el = document.createElement("div"); el.className = "toast"; el.setAttribute("role","status"); el.innerHTML = html;
  $("phone").appendChild(el); setTimeout(() => el.remove(), 2200);
}
function modal(html, ready){ $("modal-root").innerHTML = '<div class="modal-bg"><div class="modal" role="dialog" aria-modal="true">'+html+'</div></div>'; if(ready) ready(); }
const closeModal = () => { $("modal-root").innerHTML = ""; };

// ───────── 고양이 정원 ─────────
const STAGE = {x:{naong:31, aeong:71}, d:{naong:0.15, aeong:0.45}, dir:{naong:1, aeong:1}, pose:{naong:"play", aeong:"sit"}, lock:{naong:0, aeong:0}, pairUntil:0, pairPose:"yarn", night:false, watch:false, say:{who:"naong", text:""}, sayUntil:0, c3d:null};
const ACTS = {
  naong:{idle:["play","sit","yarn","stretch","laugh","roll","look","loaf","groom","wonder","stalk","fish","side","reach","nap","lookup"], move:["walk","run"]},
  aeong:{idle:["sit","yarn","roll","curious","stretch","cheer","groom","lookup","laugh","wash","loaf","stalk","flower","fish","reach","nap"], move:["walk","fly"]}
};
const PAIRS = ["yarn","cuddle","box","boxes","eat","kiss","smile","nuzzle","lick","wave","look","hug","tummy","tickle","sing","blanket","sleep","back"];
const FACES_LEFT = {aeong_stretch:true, aeong_yarn:true, aeong_paw:true, aeong_stalk:true, aeong_flower:true, aeong_dash:true, aeong_pounce:true, aeong_leap:true, aeong_curious:true};
function setPose(k, pose){
  STAGE.pose[k] = pose; const img = $("img-"+k); img.src = spr(k, pose);
  img.style.transform = "scaleX(" + ((FACES_LEFT[k+"_"+pose] ? -1 : 1) * STAGE.dir[k]) + ")";
}
function hop(k){ const a = $("act-"+k); a.classList.remove("hopping"); void a.offsetWidth; a.classList.add("hopping"); setTimeout(() => a.classList.remove("hopping"), 820); }
function place(k){
  const a = $("act-"+k), d = STAGE.d[k];
  a.style.left = STAGE.x[k] + "%"; a.style.bottom = (8 + d*12) + "px";
  a.style.transform = "scale(" + (1 - d*0.06).toFixed(3) + ")"; a.style.zIndex = String(4 - Math.round(d*2));
}
function showBubble(){
  const pair = !$("pair").classList.contains("hidden"), b = $("bub");
  b.textContent = STAGE.say.text || "";
  b.style.left = pair ? "50%" : clamp(STAGE.x[STAGE.say.who], 24, 76) + "%";
  if(STAGE.c3d){ const t = {}; t[STAGE.say.who] = STAGE.say.text; STAGE.c3d.setEnv({text:t, watch:STAGE.watch, night:STAGE.night}); b.textContent = ""; }
}
function stageApply(){
  const showPair = !STAGE.c3d && (STAGE.night || Date.now() < STAGE.pairUntil);
  $("pair").classList.toggle("hidden", !showPair);
  ["naong","aeong"].forEach(k => $("act-"+k).classList.toggle("hidden", showPair));
  if(showPair) $("img-pair").src = spr("both", STAGE.night ? "nap" : STAGE.pairPose);
  if(STAGE.watch && STAGE.pose.aeong !== "curious") setPose("aeong", "curious");
  showBubble();
}
function stageTick(){
  const on = view === "today" && !document.hidden && !$("game-root").innerHTML;
  if(STAGE.c3d){ STAGE.c3d.setActive(on); return; }
  if(!on) return;
  if(STAGE.night){ stageApply(); return; }
  if(Date.now() > STAGE.pairUntil && Math.random() < 0.09){ STAGE.pairUntil = Date.now() + 5000; STAGE.pairPose = PAIRS[Math.floor(Math.random()*PAIRS.length)]; stageApply(); return; }
  stageApply();
  if(Date.now() < STAGE.pairUntil) return;
  ["naong","aeong"].forEach(k => {
    if(Date.now() < STAGE.lock[k] || (k === "aeong" && STAGE.watch) || Math.random() < 0.45) return;
    const other = k === "naong" ? "aeong" : "naong", a = $("act-"+k);
    if(Math.random() < 0.45){
      let nx, tries = 0; do { nx = 24 + Math.random()*52; tries++; } while(Math.abs(nx - STAGE.x[other]) < 36 && tries < 30);
      STAGE.dir[k] = nx > STAGE.x[k] ? 1 : -1;
      const mv = ACTS[k].move[Math.floor(Math.random()*2)]; setPose(k, mv);
      if(mv === "fly") hop(k); else a.classList.add("walking");
      STAGE.x[k] = nx; STAGE.d[k] = Math.random(); place(k); STAGE.lock[k] = Date.now() + 1700;
      setTimeout(() => { a.classList.remove("walking"); if(!(STAGE.watch && k === "aeong")) setPose(k, ACTS[k].idle[Math.floor(Math.random()*ACTS[k].idle.length)]); showBubble(); }, 1600);
    } else {
      STAGE.dir[k] = STAGE.x[k] < STAGE.x[other] ? 1 : -1;
      setPose(k, ACTS[k].idle[Math.floor(Math.random()*ACTS[k].idle.length)]);
    }
  });
  showBubble();
}
function catSay(who, text, ms){ STAGE.say = {who:who, text:text}; STAGE.sayUntil = Date.now() + (ms || 4000); showBubble(); }
function catJoy(k){ if(STAGE.c3d){ STAGE.c3d.react(k); return; } STAGE.pairUntil = 0; stageApply(); STAGE.dir[k] = 1; setPose(k, "cheer"); hop(k); STAGE.lock[k] = Date.now() + 1800; }
function petCat(k){
  const c = S.cats[k], t = TK();
  if(c.pets.d !== t) c.pets = {d:t, n:0};
  if(c.pets.n < 5){ c.pets.n++; cheer(k, 2, 1); save(); }
  const lines = k === "naong" ? ["냐앙~ 쓰담쓰담 좋아!", "골골골…", "냥! 오늘도 같이 가자"] : ["애옹! 간지러워~", "미야옹, 같이 놀자", "냐아~ 기분 좋아"];
  catJoy(k); catSay(k, lines[Math.floor(Math.random()*lines.length)]);
  [-18, 0, 18].forEach((dx, i) => { const h = document.createElement("span"); h.className = "fxh"; h.textContent = "♥"; h.style.left = "calc("+STAGE.x[k]+"% + "+(dx-8)+"px)"; h.style.bottom = "120px"; h.style.setProperty("--dx", dx+"px"); h.style.animationDelay = (i*0.1)+"s"; $("garden-fx").appendChild(h); setTimeout(() => h.remove(), 1400); });
  try{ navigator.vibrate && navigator.vibrate(15); }catch(e){}
}
// 실제 3D 모델(models/models.json + GLB)이 준비되면 자동으로 3D 고양이로 바뀐다. 없으면 그림 고양이 그대로.
const loaded = {};
function loadScript(src){ return loaded[src] || (loaded[src] = new Promise((res, rej) => { const el = document.createElement("script"); el.src = src; el.onload = res; el.onerror = () => rej(new Error(src)); document.head.appendChild(el); })); }
function init3D(){ return;
  if(!window.fetch) return;
  try{ fetch("models/models.json").then(r => r.ok ? r.json() : null).then(m => {
    if(!m || !m.naong || !m.aeong) return;
    return loadScript("vendor/three.min.js").then(() => loadScript("vendor/GLTFLoader.js")).then(() => loadScript("cat3d.js"))
      .then(() => window.Cat3D.start({stage:$("stage"), manifest:m, names:{naong:"나옹이", aeong:"애옹이"}, onTap:petCat}))
      .then(api => { STAGE.c3d = api; $("stage").classList.add("mode3d"); stageApply(); });
  }).catch(() => {}); }catch(e){}
}

// ───────── 오늘 ─────────
const UI = {tasksOpen:false, tableDay:null, tableMode:"day", evOpen:-1, wkSel:null};
function situation(){
  const ev = todayEvents(), m = nowMin(), d = day();
  let cur = -1, next = -1, ended = -1;
  ev.forEach((e,i) => {
    if(toMin(e[0]) <= m && m < toMin(e[1])) cur = i;
    if(next < 0 && toMin(e[0]) > m) next = i;
    if(toMin(e[1]) <= m && m - toMin(e[1]) <= 30 && !d.cls[i]) ended = i;     // 방금 끝났고 아직 체크 안 한 일정
  });
  return {ev, m, d, cur, next, ended};
}
function renderHeader(){
  const d = now(), h = d.getHours();
  $("h-date").innerHTML = CAL + '<span>지안이의 '+(d.getMonth()+1)+"월 "+d.getDate()+"일 "+DAYS[d.getDay()]+'요일</span>';
  $("h-fish").innerHTML = FISH + S.fish;
}
function renderGarden(st, p){
  STAGE.night = st.m >= 22*60 || st.m < 6*60; STAGE.watch = !!S.running;
  if(Date.now() > STAGE.sayUntil) STAGE.say = {who:"naong", text:""};
  stageApply();
}
const FISHS = FISH.replace('width="18" height="18"','width="14" height="14"');
function nowCard(st){
  let i = st.cur, mode = "cur";
  if(i < 0 && st.ended >= 0){ i = st.ended; mode = "ended"; }
  else if(i < 0 && st.next >= 0){ i = st.next; mode = "next"; }
  if(i < 0){
    const any = st.ev.length > 0;
    return '<div class="card now row"><span class="tico" style="background:var(--gs)">'+catImg("naong", any ? "loaf" : "tower", 46)+'</span><div class="sp"><p class="nm">'+(!any ? "오늘은 쉬는 날이에요" : st.ev.every((e,j) => st.d.cls[j]) ? "오늘 일정 끝! 수고했어요" : "오늘 일정 시간이 모두 지났어요")+'</p></div></div>';
  }
  const e = st.ev[i], s = toMin(e[0]), en = toMin(e[1]), done = !!st.d.cls[i], type = e[4] || "study";
  const title = mode === "cur" ? "지금은 "+esc(e[2])+"!" : mode === "ended" ? esc(e[2])+" 끝났어요!" : "다음은 "+esc(e[2]);
  const pct = mode === "cur" ? clamp((st.m - s) / (en - s) * 100, 0, 100) : 100;
  const right = done ? '<span class="tag g">완료</span>' : mode === "ended" ? '<button class="btn y sm" data-cls="'+i+'">'+CHECK+'다 했어요</button>' : '';
  return '<div class="card now row">'+(type === "school" ? '<img class="tpic" src="'+art("ic_school")+'" alt="">' : '<span class="tico t-'+type+'">'+ticon(type, 34)+'</span>')+'<div class="sp"><p class="nm">'+title+'</p><p class="small mut">'+e[0]+' – '+e[1]+(mode === "next" ? ' · '+durTxt(s - st.m)+' 뒤 시작' : e[3] ? ' · '+esc(e[3]) : '')+'</p>'
    + (mode === "next" ? '' : '<div class="bar y" style="margin-top:8px"><i style="width:'+pct.toFixed(0)+'%"></i></div>')+'</div>'+right+'</div>';
}
function scheduleCard(st, p){
  const rows = st.ev.map((e,i) => {
    const past = toMin(e[1]) <= st.m, cur = i === st.cur;
    return '<div class="item'+(past ? " done" : "")+(cur ? " cur" : "")+'"><span class="t">'+e[0]+'</span>'+ticon(e[4] || "study", 22)+(cur
        ? '<span class="sp"><span class="nm" style="display:block">'+esc(e[2])+'</span><span class="tm" style="display:block">'+e[1]+'까지'+(e[3] ? ' · '+esc(e[3]) : '')+'</span><span class="bar y" style="display:block;margin-top:6px"><i style="width:'+clamp((st.m - toMin(e[0])) / (toMin(e[1]) - toMin(e[0])) * 100, 0, 100).toFixed(0)+'%"></i></span></span><span class="tag">지금</span>'
        : '<span class="nm sp">'+esc(e[2])+'</span>'+(past ? '<span class="stamp" role="img" aria-label="참 잘했어요 도장"><svg width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.500l2.900 6 6.600.900-4.800 4.600 1.200 6.500L12 17.400 6.100 20.500l1.200-6.500L2.500 9.400l6.600-.900z" fill="currentColor"/></svg>참 잘했어요</span>' : ''))+'</div>';
  }).join("");

const spent = r => { const m = Math.round((r.end - r.start) / 60000); return m < 1 ? "1분 미만" : durTxt(m); };
const clock = () => { if(!S.running) return ""; const s = Math.floor((Date.now()-S.running.start)/1000); return pad(Math.floor(s/60))+":"+pad(s%60); };
function tasksCard(st, p){
  const d = st.d, order = allTasks(), shown = order;

function renderToday(){
  const st = situation(), p = prog();

// 좁은 표 칸에 이름을 두 글자씩 끊어 넣는다 (화면 표시만, 일정 데이터는 그대로)
function fitName(name, h){
  let parts = [];
  name.split(" ").forEach(w => { if(w.length <= 3) parts.push(w); else if(w.length === 5){ parts.push(w.slice(0,3), w.slice(3)); } else for(let k = 0; k < w.length; k += 2) parts.push(w.slice(k, k+2)); });
  for(const o of [{fs:14, lh:16}, {fs:12.5, lh:14}, {fs:11.5, lh:12.5}]) if(parts.length * o.lh <= h - 2) return {lines:parts, fs:o.fs, lh:o.lh};
  const words = name.split(" ");
  if(words.length > 1 && words.every(w => w.length <= 4) && words.length * 13 <= h - 2) return {lines:words, fs:11, lh:13};
  const one = name.replace(/ /g, "");
  if(one.length <= 4 && h >= 15) return {lines:[one], fs:11, lh:13};
  return {lines:parts.slice(0, Math.max(1, Math.floor((h - 2) / 12.5))), fs:11.5, lh:12.5};
}

const GAMES = {
  fish:{n:"생선 잡기", ic:"game_fish", cat:"naong", key:"naong", bg:"bg_pond", how:"연못에서 헤엄치는 생선을 톡톡 눌러 잡아요!"},

  yarn:{n:"털실 공놀이", ic:"game_yarn", key:"yarn", bg:"bg_game_garden", how:"털실 공을 누르거나 끌어서 던져요. 나옹이와 애옹이가 쫓아가서 톡 쳐요!"},
  fly:{n:"나비 잡기", ic:"game_butterfly", cat:"aeong", key:"aeong", bg:"bg_game_garden", how:"날아다니는 나비를 누르면 애옹이가 폴짝 뛰어 잡아요!"},
  deco:{n:"고양이 꾸미기", ic:"game_sofa"}
};
const GAME_SECS = 30, FREE = ["yarn","match","slice","band","tower","spell"];      // FREE: 언제든 할 수 있고 생선은 하루 한 번
const gicon = g => g.img ? R(g.img) : art(g.ic);
let PLAYCAT = "naong";                                   // 지금 누구랑 노는지
const pkey = id => GAMES[id].key + "_" + PLAYCAT;        // 놀이마다, 고양이마다 하루 한 번
const PRIZE = {spell:7, match:2, slice:1, tower:1};       // 놀이별 최대 생선
const quizDone = () => { const p = day().played; return !!(p.spell_naong || p.spell_aeong); };
function gameState(id){
  if(id === "deco") return "open";
  const g = GAMES[id]; if(day().played[pkey(id)]) return "done";
  if(id === "spell") return "open";
  if(FREE.includes(id)) return quizDone() ? "open" : "locked";       // 맞춤법 퀴즈를 먼저 해야 다른 놀이가 열린다
  return unlocked(g.cat) ? "open" : "locked";
}
// 보상: 놀이를 끝까지 하면 정해진 수만큼 준다 (간식 슬라이스·츄르 타워 1, 같은 그림 찾기 2, 맞춤법 퀴즈 5)
function rewardOf(id, score){
  if(day().played[pkey(id)]) return 0;
  if(id === "spell") return Math.min(5, Math.floor(score / 2)) + (score >= 10 ? 2 : 0);    // 2개당 1마리, 다 맞히면 +2
  if(id === "match") return score >= 6 ? 2 : score >= 3 ? 1 : 0;
  if(id === "slice") return score >= 10 ? 1 : 0;
  if(id === "tower") return score >= 5 ? 1 : 0;
  if(id === "yarn") return Math.min(3, Math.floor(score / 4));
  if(id === "band") return Math.min(5, Math.floor(score / 8));
  return Math.min(20, score);
}
function tryPlay(cat){ PLAYCAT = cat; openGame(cat === "naong" ? "fish" : "fly"); }
function openGame(id){
  if(id === "deco") return decoScreen();
  const g = GAMES[id], st = gameState(id);
  if(st === "done"){ toast("오늘 "+CATS[PLAYCAT].name+"랑은 했어요. 내일 또 해요!"); return; }
  if(st === "locked"){ toast(FREE.includes(id) ? "맞춤법 퀴즈를 먼저 하면 열려요" : g.cat === "naong" ? "오늘 일정이 모두 끝나면 열려요" : "오늘 할 일을 모두 마치면 열려요"); return; }
  ({fish:fishGame, yarn:yarnGame, fly:flyGame, match:matchGame, slice:sliceGame, band:bandGame, tower:towerGame, spell:spellGame})[id]();
}
function fx(area, x, y, text){ const e = document.createElement("span"); e.className = "gfx"; e.textContent = text; e.style.left = (x-14)+"px"; e.style.top = (y-20)+"px"; area.appendChild(e); setTimeout(() => e.remove(), 850); }
function closeGame(){ $("game-root").innerHTML = ""; render(); }
function runGame(id, setup){
  const g = GAMES[id], again = false, SECS = g.secs || GAME_SECS, mmss = n => pad(Math.floor(n/60))+":"+pad(n%60);
  $("game-root").innerHTML = '<div class="game" role="dialog" aria-modal="true" aria-label="'+g.n+'">'+(g.bg ? '<img class="gbg" src="'+art(g.bg)+'" alt="">' : '')+'<div class="area" id="g-area"></div><div class="gsay" id="g-say" role="status"></div>'
    + '<div class="gtop"><button class="back" id="g-x" aria-label="뒤로 가기">'+BACK+'</button><span class="pill gp" role="timer" aria-label="남은 시간">'+CLOCK+'<span id="g-time">'+mmss(SECS)+'</span></span><span class="pill y gp" aria-label="받을 생선">'+FISH+'+<span id="g-score">0</span></span></div>'
    + (g.custom ? churuIntro(again) : '<div class="modal-bg" id="g-intro"><div class="modal"><img src="'+gicon(g)+'" alt="" style="height:72px"><h3 class="sec" style="font-size:28px">'+g.n+'</h3><p class="g-how">'+g.how+'</p>'+(again ? '<p class="g-note">오늘 생선은 이미 받았어요.<br>그냥 놀아도 좋아요!</p>' : '')+'<button class="btn y" id="g-start" style="width:100%">시작!</button></div></div>')+'</div>';
  let score = 0, running = false, t0 = 0, last = 0, raf = 0;
  const api = {area:$("g-area"), say:t => { $("g-say").textContent = t; }, add:n => { score = Math.max(0, score + n); $("g-score").textContent = rewardOf(id, score); }, _init:(() => { setTimeout(() => { const e = $("g-score"); if(e) e.textContent = rewardOf(id, 0); }, 0); })(), isOn:() => running, finish:() => { if(running){ running = false; cancelAnimationFrame(raf); setTimeout(() => gameEnd(id, score), 600); } }};
  const game = setup(api);
  $("g-x").onclick = () => { running = false; cancelAnimationFrame(raf); closeGame(); };      // 중간에 나가면 보상 없이 닫히고, 오늘 기회는 그대로 남는다
  $("g-start").onclick = () => { $("g-intro").remove(); running = true; t0 = last = performance.now(); raf = requestAnimationFrame(loop); };
  function loop(ts){
    if(!running) return;
    const dt = Math.min(50, ts - last) / 1000, el = (ts - t0) / 1000; last = ts;
    $("g-time").textContent = mmss(Math.max(0, SECS - Math.floor(el)));
    game.tick(dt, el);
    if(el >= SECS){ running = false; gameEnd(id, score); return; }
    raf = requestAnimationFrame(loop);
  }
}
function gameEnd(id, score){
  const g = GAMES[id], d = day(), got = rewardOf(id, score);
  if(!d.played[pkey(id)]){            // 완료 한 번에 한 번만 지급
    d.played[pkey(id)] = {score:score, at:Date.now()};
    if(got){ S.fish += got; logAdd(g.n+" 놀이", "+"+got); }
    ["naong","aeong"].forEach(k => cheer(k, 15, 3));
  } else ["naong","aeong"].forEach(k => cheer(k, 5, 0));
  save();
  const box = document.createElement("div"); box.className = "modal-bg result";
  box.innerHTML = '<div class="rays"></div><div class="modal rcard" role="alertdialog" aria-label="놀이 끝"><h3 class="sec" style="font-size:28px">잘 놀았어요! '+PAW+'</h3><p class="rfish">'+FISH.replace('width="18" height="18"','width="44" height="44"')+'+'+got+'</p>'
    + (got ? '' : '<p class="small mut">'+"다음엔 더 많이 놀아 봐요!"+'</p>')+''+'<button class="btn y" id="g-home" style="width:100%">확인</button>'+'</div>'
    + '<img class="rc l joy" src="'+spr("naong","laugh")+'" alt=""><img class="rc r joy" src="'+spr("aeong","cheer")+'" alt="">';
  $("game-root").querySelector(".game").appendChild(box);
  $("g-home").onclick = () => { $("game-root").innerHTML = ""; show("room"); };
  if(g.custom) box.classList.add("cz");
}

const MATCHPOOL = ["naong_sit","naong_laugh","naong_look","naong_loaf","naong_groom","naong_eat","naong_fish","naong_yarn","naong_stretch","naong_roll","naong_walk","naong_sleep","aeong_sit","aeong_cheer","aeong_laugh","aeong_groom","aeong_eat","aeong_fish","aeong_stretch","aeong_roll","aeong_fly","aeong_sleep","aeong_loaf","aeong_wash","both_kiss","both_smile","both_sing","both_nap","both_boxes"];
const shuffle = a => { a = a.slice(); for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function matchGame(){ runGame("match", api => {
  const pick = shuffle(MATCHPOOL).slice(0, 6), deck = shuffle(pick.concat(pick)), grid = document.createElement("div");
  grid.className = "mgrid"; api.area.appendChild(grid);
  let open = [], lock = false, found = 0, flips = 0;
  const info = document.createElement("p"); info.className = "minfo"; info.textContent = "뒤집은 횟수 0번"; api.area.appendChild(info);
  deck.forEach((name, i) => {
    const b = document.createElement("button"); b.className = "mcard"; b.setAttribute("aria-label", "카드 "+(i+1)+" (뒤집힌 카드)");
    b.innerHTML = '<span class="mb">'+PAW+'</span><span class="mf"><img src="'+R("sprites/"+name+".webp")+'" alt=""></span>';
    b.onclick = () => {
      if(!api.isOn() || lock || b.classList.contains("open") || b.classList.contains("ok")) return;
      b.classList.add("open"); b.setAttribute("aria-label", "카드 "+(i+1)+" 열림"); open.push({b:b, name:name}); flips++; info.textContent = "뒤집은 횟수 "+flips+"번";
      if(open.length < 2) return;
      const [x, y] = open; open = [];
      if(x.name === y.name){ [x, y].forEach(c => c.b.classList.add("ok")); found++; api.add(1); api.say(found === 6 ? "다 찾았다! 최고야" : "찾았다!"); try{ navigator.vibrate && navigator.vibrate(20); }catch(e){} if(found === 6) api.finish(); }
      else { lock = true; setTimeout(() => { [x, y].forEach(c => { c.b.classList.remove("open"); }); lock = false; }, 750); }
    };
    grid.appendChild(b);
  });
  return {tick(){}};
}); }
// 간식 슬라이스: 아래에서 솟아오르는 간식을 손가락으로 긋는다. 털실 공을 건드리면 점수가 깎인다
function sliceGame(){ runGame("slice", api => {
  const area = api.area, W = () => area.clientWidth, H = () => area.clientHeight, SN = ["snack_can","snack_milk","snack_chur","snack_salmon","game_fish"];
  let items = [], acc = 0.5, down = false, lp = null;
  const cats = ["naong","aeong"].map((k, i) => { const e = document.createElement("img"); e.className = "gact"; e.alt = CATS[k].name; e.src = spr(k, "lookup"); e.style.cssText = "top:auto;left:"+(i ? "auto" : "8px")+";right:"+(i ? "8px" : "auto")+";bottom:calc(6px + env(safe-area-inset-bottom));height:118px"; area.appendChild(e); return e; });
  let cheerT = 0;
  function spawn(el){
    const bad = Math.random() < 0.16, e = document.createElement("img"); e.className = "sitem"; e.alt = ""; e.src = art(bad ? "game_yarn" : SN[Math.floor(Math.random() * SN.length)]);
    const x = W() * (0.15 + Math.random() * 0.7), g = 620, peak = H() * (0.42 + Math.random() * 0.3), vy = -Math.sqrt(2 * g * peak);
    area.appendChild(e); items.push({el:e, x:x, y:H() + 30, vx:(W()/2 - x) * (0.3 + Math.random() * 0.5), vy:vy, g:g, rot:Math.random() * 360, vr:(Math.random() - 0.5) * 240, bad:bad, dead:false});
  }
  const pos = e => { const r = area.getBoundingClientRect(); return {x:e.clientX - r.left, y:e.clientY - r.top}; };
  function cut(p, q){
    const d = document.createElement("i"); d.className = "strail"; const len = Math.hypot(q.x - p.x, q.y - p.y); d.style.cssText = "left:"+p.x+"px;top:"+p.y+"px;width:"+len+"px;transform:rotate("+Math.atan2(q.y - p.y, q.x - p.x)+"rad)"; area.appendChild(d); setTimeout(() => d.remove(), 260);
    items.forEach(it => { if(it.dead) return;
      const vx = q.x - p.x, vy = q.y - p.y, t = clamp(((it.x - p.x) * vx + (it.y - p.y) * vy) / (vx * vx + vy * vy || 1), 0, 1), dist = Math.hypot(it.x - (p.x + vx * t), it.y - (p.y + vy * t));
      if(dist > 40) return;
      it.dead = true; it.el.classList.add("cut"); setTimeout(() => it.el.remove(), 260);
      if(it.bad){ api.add(-2); fx(area, it.x, it.y - 20, "앗!"); api.say("털실은 건드리면 안 돼!"); }
      else { api.add(1); fx(area, it.x, it.y - 20, "+1"); api.say(""); cats.forEach((c, i) => { c.src = spr(i ? "aeong" : "naong", i ? "cheer" : "laugh"); }); cheerT = 0.5; try{ navigator.vibrate && navigator.vibrate(10); }catch(e){} }
    });
  }
  area.addEventListener("pointerdown", e => { if(!api.isOn()) return; down = true; lp = pos(e); cut(lp, {x:lp.x + 1, y:lp.y}); try{ area.setPointerCapture(e.pointerId); }catch(_){} });
  area.addEventListener("pointermove", e => { if(!down || !api.isOn()) return; const p = pos(e); if(Math.hypot(p.x - lp.x, p.y - lp.y) < 6) return; cut(lp, p); lp = p; });
  const up = () => { down = false; }; area.addEventListener("pointerup", up); area.addEventListener("pointercancel", up);
  return {tick(dt, el){
    acc += dt; if(acc > Math.max(0.5, 1.050 - el * 0.018)){ acc = 0; spawn(el); if(el > 12 && Math.random() < 0.4) spawn(el); }
    if(cheerT > 0){ cheerT -= dt; if(cheerT <= 0) cats.forEach((c, i) => { c.src = spr(i ? "aeong" : "naong", "lookup"); }); }
    items = items.filter(it => { if(it.dead) return false; it.vy += it.g * dt; it.x += it.vx * dt; it.y += it.vy * dt; it.rot += it.vr * dt;
      if(it.y > H() + 60 && it.vy > 0){ it.el.remove(); return false; }
      it.el.style.transform = "translate("+(it.x - 36).toFixed(1)+"px,"+(it.y - 36).toFixed(1)+"px) rotate("+it.rot.toFixed(0)+"deg)"; return true; });
  }};
}); }
// 고양이 밴드: 네 칸으로 내려오는 음표를 줄에 닿을 때 누른다. 누를 때마다 '작은 별' 가락의 음이 난다
const SONG = "C C G G A A G - F F E E D D C - G G F F E E D - G G F F E E D - C C G G A A G - F F E E D D C -".split(" ");
const NOTEHZ = {C:261.630, D:293.660, E:329.630, F:349.230, G:392, A:440}, NOTELANE = {C:0, D:1, E:2, F:3, G:1, A:2};
function ding(hz){
  try{ AC = AC || new (window.AudioContext || window.webkitAudioContext)(); AC.resume(); const t = AC.currentTime, o = AC.createOscillator(), o2 = AC.createOscillator(), g = AC.createGain();
    o.type = "triangle"; o2.type = "sine"; o.frequency.value = hz; o2.frequency.value = hz * 2; const g2 = AC.createGain(); g2.gain.value = 0.25;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.32, t + 0.012); g.gain.exponentialRampToValueAtTime(0.001, t + 0.55);
    o.connect(g); o2.connect(g2); g2.connect(g); g.connect(AC.destination); o.start(t); o2.start(t); o.stop(t + 0.6); o2.stop(t + 0.6); }catch(e){}
}
function bandGame(){ runGame("band", api => {
  const area = api.area, H = () => area.clientHeight, LINE = () => H() - 120, FALL = 2.200, BEAT = 0.620, START = 1.200;
  area.classList.add("band");
  area.innerHTML = '<div class="bstage"><img id="b-cats" src="'+spr("both","smile")+'" alt="나옹이와 애옹이"></div>'+[0,1,2,3].map(i => '<button class="blane l'+i+'" data-lane="'+i+'" aria-label="'+(i+1)+'번째 칸"></button>').join("")+'<div class="bline" id="b-line"></div>';
  const lanes = [...area.querySelectorAll(".blane")], catsEl = area.querySelector("#b-cats");
  let notes = [], next = 0, combo = 0, singT = 0;
  const hit = lane => {
    if(!api.isOn()) return;
    const el = lanes[lane]; el.classList.remove("tap"); void el.offsetWidth; el.classList.add("tap");
    let best = null; notes.forEach(n => { if(n.lane === lane && !n.done && Math.abs(n.y - LINE()) < 62 && (!best || Math.abs(n.y - LINE()) < Math.abs(best.y - LINE()))) best = n; });
    if(!best){ combo = 0; return; }
    best.done = true; best.el.classList.add("hit"); setTimeout(() => best.el.remove(), 220); ding(best.hz); combo++; api.add(1);
    fx(area, el.offsetLeft + el.offsetWidth / 2, LINE() - 40, combo >= 3 ? combo+"번 연속!" : "딱!");
    catsEl.src = spr("both", "sing"); catsEl.classList.remove("joy"); void catsEl.offsetWidth; catsEl.classList.add("joy"); singT = 0.450;
  };
  lanes.forEach((b, i) => b.addEventListener("pointerdown", e => { e.preventDefault(); hit(i); }));
  return {tick(dt, el){
    area.querySelector("#b-line").style.top = LINE()+"px";
    while(next < SONG.length && el >= START + next * BEAT - FALL){ const nm = SONG[next++]; if(nm === "-") continue;
      const lane = NOTELANE[nm], e = document.createElement("span"); e.className = "bnote"; e.textContent = "♪"; lanes[lane].appendChild(e); notes.push({el:e, lane:lane, hz:NOTEHZ[nm], at:START + (next - 1) * BEAT, y:0, done:false}); }
    if(singT > 0){ singT -= dt; if(singT <= 0) catsEl.src = spr("both", "smile"); }
    notes = notes.filter(n => { if(n.done) return false; n.y = LINE() - (n.at - el) / FALL * (LINE() - 150);
      if(n.y > H() + 40){ n.el.remove(); combo = 0; return false; }
      n.el.style.transform = "translateY("+(n.y - 34).toFixed(1)+"px)"; return true; });
  }};
}); }

      if(ball.y < top()){ ball.y = top(); ball.vy = Math.abs(ball.vy)*0.7; } if(ball.y > bot()){ ball.y = bot(); ball.vy = -Math.abs(ball.vy)*0.7; }

function flyGame(){ runGame("fly", api => {
  const area = api.area, W = () => area.clientWidth, H = () => area.clientHeight;
  const mk = (k, pose, x) => { const e = document.createElement("img"); e.className = "gact"; e.alt = CATS[k].name; e.src = spr(k, pose); e.style.height = "120px"; area.appendChild(e); return {k:k, el:e, x:x, y:H()*0.86, jx:0, jy:0, t:0}; };
  const naong = mk("naong", "look", W()*0.26), aeong = mk("aeong", "lookup", W()*0.66);
  let flies = [], pend = 0, nT = 0;
  function spawn(){
    const b = document.createElement("button"); b.className = "gfly"; b.setAttribute("aria-label", "나비 잡기");
    b.innerHTML = '<img src="'+art("game_butterfly")+'" alt="" style="display:block;filter:hue-rotate('+[0,0,-35,160,250][Math.floor(Math.random()*5)]+'deg)">';
    const left = Math.random() < 0.5, f = {el:b, x:left ? -40 : W() + 40, y:H()*(0.2 + Math.random()*0.35), tx:0, ty:0, sp:70 + Math.random()*60, ph:Math.random()*6, dead:false};
    const pick = () => { f.tx = 40 + Math.random()*(W() - 80); f.ty = H()*(0.17 + Math.random()*0.45); }; f.pick = pick; pick();
    b.addEventListener("pointerdown", e => { e.preventDefault(); if(f.dead || !api.isOn()) return; f.dead = true; api.add(1); b.classList.add("pop"); fx(area, f.x, f.y - 26, "+1");
      aeong.jx = f.x; aeong.jy = f.y + 70; aeong.t = 0.550; aeong.el.src = spr("aeong","fly"); aeong.flip = f.x < aeong.x ? 1 : -1;
      naong.el.src = spr("naong","laugh"); nT = 0.700; try{ navigator.vibrate && navigator.vibrate(15); }catch(_){} setTimeout(() => b.remove(), 280); pend += 1; });
    area.appendChild(b); flies.push(f);
  }
  for(let i = 0; i < 3; i++) spawn();
  let wait = 0;
  return {tick(dt){
    if(pend > 0){ wait += dt; if(wait > 0.600){ wait = 0; pend--; spawn(); } }
    flies = flies.filter(f => { if(f.dead) return false; const dx = f.tx - f.x, dy = f.ty - f.y, d = Math.hypot(dx, dy); if(d < 12) f.pick(); else { f.x += dx/d*f.sp*dt; f.y += dy/d*f.sp*dt; } f.ph += dt*5;
      f.el.style.transform = "translate("+(f.x - 37).toFixed(1)+"px,"+(f.y - 34 + Math.sin(f.ph)*7).toFixed(1)+"px)"; return true; });
    if(nT > 0){ nT -= dt; if(nT <= 0) naong.el.src = spr("naong","look"); }
    let ax = aeong.x, ay = aeong.y, flip = 1;
    if(aeong.t > 0){ aeong.t -= dt; const p = 1 - aeong.t/0.550, up = Math.sin(Math.min(1, p)*Math.PI); ax = aeong.x + (aeong.jx - aeong.x)*up; ay = aeong.y + (aeong.jy - aeong.y)*up; flip = aeong.flip;
      if(aeong.t <= 0){ aeong.el.src = spr("aeong","cheer"); aeong.back = 0.600; } }
    else if(aeong.back > 0){ aeong.back -= dt; if(aeong.back <= 0) aeong.el.src = spr("aeong","lookup"); }
    const wa = aeong.el.offsetWidth || 110, wn = naong.el.offsetWidth || 90;
    aeong.el.style.transform = "translate("+(ax - wa/2).toFixed(1)+"px,"+(ay - 120).toFixed(1)+"px) scaleX("+flip+")";
    naong.el.style.transform = "translate("+(naong.x - wn/2).toFixed(1)+"px,"+(naong.y - 120).toFixed(1)+"px)";
  }};
}); }

// ───────── 대화하기 ─────────
window.__meow = {at:(...a) => meowAt(...a), kinds:() => Object.keys(MEOWS), reply:d => buildReply(d), load:c => loadSounds(c)};   // 소리 점검용
// 지안이가 마이크 버튼을 누르고 말하면, 다 말한 뒤 고양이들이 여러 가지 울음소리로 대답한다.
// 실제로 목소리를 녹음하거나 어디로 보내지 않는다 — 말한 시간의 길이만 재서 대답 길이를 맞춘다.
// 울음소리는 Web Audio로 그 자리에서 만들어 낸다 (나옹이는 낮은 목소리, 애옹이는 높은 목소리).
// 울음소리는 실제 고양이 녹음(공개 도메인 CC0, freesound 원본 · ESC-50 데이터셋 수록)을 쓴다.
// 고양이마다 다른 녹음을 쓰고, 빠르기·높이·길이를 조금씩 바꿔서 매번 다르게 들리게 한다.
const CATVOICE = {naong:{rate:0.88, clips:["m05","m06","m07","m08","m09","m02"], long:["m06","m07","m09"], short:["m02","m05"]},
                  aeong:{rate:1.12, clips:["m00","m01","m03","m04"], long:["m01","m00"], short:["m03","m04"]}};
const MEOWS = {
  mew:    {w:{naong:["냥!","먀!","냐!"], aeong:["앵!","먕!","애옹!"]}},
  meow:   {w:{naong:["야옹~","냐옹","야아옹"], aeong:["애옹~","먀옹","애오옹"]}},
  long:   {w:{naong:["냐아아아옹~","야오오오옹~","므야아아옹"], aeong:["애오오오옹~","먀아아아옹~","애애애옹~"]}},
  ask:    {w:{naong:["냐옹?","먀?","냥?"], aeong:["애옹?","먕?","앵?"]}},
  twice:  {w:{naong:["야옹 야옹!","냐옹 냐아옹"], aeong:["애옹 애옹!","먀옹 애오옹"]}},
  chatter:{w:{naong:["냐냐냐냐!","먁먁먁!"], aeong:["애애애앵!","먀먀먀먀!"]}}
};
const rnd = (a, b) => a + Math.random() * (b - a), pickOne = a => a[Math.floor(Math.random() * a.length)];
const SND = {};
function loadSounds(ctx){
  const names = ["m00","m01","m02","m03","m04","m05","m06","m07","m08","m09"];
  return Promise.all(names.map(n => SND[n] ? 0 : fetch(R("snd/"+n+".mp3")).then(r => r.arrayBuffer()).then(ab => new Promise((ok, no) => ctx.decodeAudioData(ab, ok, no))).then(b => { SND[n] = b; }).catch(() => {})));
}
// 녹음 한 토막을 t 시각에 튼다. rate=빠르기(높이), cut=앞부분만 쓸 길이(초), rise=끝을 올려 묻는 말투로
function playClip(ctx, out, t, name, rate, cut, rise){
  const buf = SND[name]; if(!buf) return 0;
  const src = ctx.createBufferSource(), g = ctx.createGain(); src.buffer = buf;
  const len = Math.min(buf.duration, cut || 99), d = len / rate;
  src.playbackRate.setValueAtTime(rate, t);
  if(rise){ src.playbackRate.setValueAtTime(rate, t + d * 0.5); src.playbackRate.linearRampToValueAtTime(rate * 1.300, t + d * 0.92); }
  g.gain.setValueAtTime(1, t); if(cut && cut < buf.duration){ g.gain.setValueAtTime(1, t + d - 0.05); g.gain.linearRampToValueAtTime(0, t + d); }
  src.connect(g); g.connect(out); src.start(t, 0, len + 0.02); return rise ? d * 0.9 : d;
}
function meowAt(ctx, out, t, cat, kind){
  const v = CATVOICE[cat], r = v.rate * rnd(0.94, 1.07);
  if(kind === "mew") return playClip(ctx, out, t, pickOne(v.short), r * 1.120, rnd(0.26, 0.36));
  if(kind === "long") return playClip(ctx, out, t, pickOne(v.long), r * rnd(0.74, 0.82));
  if(kind === "ask") return playClip(ctx, out, t, pickOne(v.clips), r * 1.040, rnd(0.42, 0.55), true);
  if(kind === "twice"){ const a = pickOne(v.clips), d1 = playClip(ctx, out, t, a, r * 1.050, 0.5); return d1 + 0.09 + playClip(ctx, out, t + d1 + 0.09, pickOne(v.clips.filter(x => x !== a)), r * 0.960); }
  if(kind === "chatter"){ let at = t; const n = Math.round(rnd(3, 5)), c = pickOne(v.short); for(let i = 0; i < n; i++) at += playClip(ctx, out, at, c, r * rnd(1.180, 1.320), rnd(0.15, 0.2)) + 0.04; return at - t; }
  return playClip(ctx, out, t, pickOne(v.clips), r);
}
// 말한 길이에 맞춰 대답을 짠다: 짧게 말하면 한두 마디, 길게 말하면 여러 마디에 긴 울음도 섞는다
function buildReply(spoke){
  const n = spoke < 1.500 ? 1 : spoke < 3.500 ? 2 : spoke < 6 ? 3 : 4, kinds = Object.keys(MEOWS), out = [];
  let who = Math.random() < 0.5 ? "naong" : "aeong", prev = "";
  for(let i = 0; i < n; i++){
    let pool = kinds.filter(k => k !== prev);
    if(n === 1) pool = ["mew","meow","ask","meow","long","twice"];
    if(n >= 3 && i === 1 && Math.random() < 0.6) pool = ["long"];
    const k = pickOne(pool); out.push({cat:who, kind:k, text:pickOne(MEOWS[k].w[who])}); prev = k;
    if(Math.random() < 0.45) who = who === "naong" ? "aeong" : "naong";
  }
  return out;
}
let AC = null;
function talkScreen(){
  $("game-root").innerHTML = '<div class="game deco talk" role="dialog" aria-modal="true" aria-label="대화하기"><div class="gtop"><button class="back" id="g-x" aria-label="뒤로 가기">'+BACK+'</button><b class="hand" style="font-size:26px">대화하기</b><span style="width:44px"></span></div>'
    + '<div class="tscene"><img class="rbg" src="'+art("bg_game_garden")+'" alt=""><div class="tcat l" id="tc-naong"><span class="tbub" id="tb-naong" role="status"></span><img src="'+spr("naong","sit")+'" alt="나옹이"></div><div class="tcat r" id="tc-aeong"><span class="tbub" id="tb-aeong" role="status"></span><img src="'+spr("aeong","sit2")+'" alt="애옹이"></div></div>'
    + '<p class="tmsg" id="t-msg" role="status">마이크를 누르고 말해 봐!</p>'
    + '<button class="micbtn" id="t-mic" aria-pressed="false" aria-label="말하기 시작">'+MIC+'</button>'
    + '<p class="small mut" style="text-align:center;margin:0 24px">목소리는 녹음하지 않아요. 소리가 안 나면 휴대폰 무음 모드를 풀어 주세요.</p></div>';
  let state = "idle", t0 = 0, auto = 0, timers = [], ready = null;
  const mic = $("t-mic"), msg = $("t-msg"), setCat = (k, pose) => { $("tc-"+k).querySelector("img").src = spr(k, pose); };
  const rest = () => { setCat("naong", "sit"); setCat("aeong", "sit2"); };
  const stopAll = () => { timers.forEach(clearTimeout); timers = []; clearTimeout(auto); };
  $("g-x").onclick = () => { stopAll(); try{ if(AC) AC.suspend(); }catch(e){} closeGame(); };
  function listen(){
    try{ AC = AC || new (window.AudioContext || window.webkitAudioContext)(); AC.resume(); ready = ready || loadSounds(AC); }catch(e){ AC = null; }
    state = "listen"; t0 = Date.now(); mic.classList.add("on"); mic.setAttribute("aria-pressed", "true"); mic.setAttribute("aria-label", "다 말했어요");
    msg.textContent = "듣고 있어… 다 말하면 한 번 더 눌러!"; $("tb-naong").textContent = ""; $("tb-aeong").textContent = "";
    setCat("naong", "look"); setCat("aeong", "curious"); auto = setTimeout(answer, 9000);
  }
  function answer(){
    clearTimeout(auto); if(state !== "listen") return;
    const spoke = (Date.now() - t0) / 1000;
    state = "reply"; mic.classList.remove("on"); mic.disabled = true; msg.textContent = "";
    Promise.race([ready || Promise.resolve(), new Promise(r => setTimeout(r, 4000))]).then(() => speak(spoke));
  }
  function speak(spoke){
    if(!$("t-mic")) return;
    const reply = buildReply(spoke);
    state = "reply"; mic.classList.remove("on"); mic.disabled = true; mic.setAttribute("aria-pressed", "false"); msg.textContent = "";
    let t = AC ? AC.currentTime + 0.35 : 0, delay = 350, master = null;
    if(AC){ master = AC.createDynamicsCompressor(); const mg = AC.createGain(); mg.gain.value = 1; master.connect(mg); mg.connect(AC.destination); }
    reply.forEach(u => {
      const d = (AC && meowAt(AC, master, t, u.cat, u.kind)) || rnd(0.5, 0.9), gap = rnd(0.16, 0.38);
      timers.push(setTimeout(() => { const b = $("tb-"+u.cat); if(!b) return; b.textContent = (b.textContent ? b.textContent+" " : "")+u.text;
        setCat(u.cat, u.kind === "ask" ? (u.cat === "naong" ? "look" : "lookup") : u.kind === "long" ? (u.cat === "naong" ? "stretch" : "cheer") : (u.cat === "naong" ? "laugh" : "cheer"));
        const c = $("tc-"+u.cat); c.classList.remove("say"); void c.offsetWidth; c.classList.add("say"); }, delay));
      t += d + gap; delay += (d + gap) * 1000;
    });
    timers.push(setTimeout(() => { state = "idle"; mic.disabled = false; mic.setAttribute("aria-label", "말하기 시작"); msg.textContent = "또 말해 볼까?"; rest();
      const day0 = TK(); ["naong","aeong"].forEach(k => { const c = S.cats[k]; c.talk = c.talk && c.talk.d === day0 ? c.talk : {d:day0, n:0}; if(c.talk.n < 5){ c.talk.n++; cheer(k, 2, 1); } }); save(); }, delay + 300));
  }
  mic.onclick = () => { if(state === "idle") listen(); else if(state === "listen") answer(); };
}
